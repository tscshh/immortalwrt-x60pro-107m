name: Build ImmortalWrt 25.10 for Ruijie X60 PRO (107M)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ImmortalWrt 版本'
        required: true
        default: 'v25.10'
      clean:
        description: '纯净版 (仅基础包+LuCI)'
        default: 'true'

env:
  DEVICE_NAME: ruijie_rg-x60-pro-107m
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3-distutils python3-setuptools rsync \
            swig unzip zlib1g-dev file wget python3-pyelftools \
            libelf-dev ecj fastjar java-propose-classpath \
            python3 python2.7-dev python2.7 \
            time xsltproc docbook-utils fop dblatex xmlto \
            genisoimage grub-common p7zip-full

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b ${{ github.event.inputs.version }} https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          echo "immortalwrt cloned, version: ${{ github.event.inputs.version }}"

      - name: Apply 107M layout DTS
        run: |
          cp mt7986a-ruijie-rg-x60-pro-107m.dts \
            immortalwrt/target/linux/mediatek/dts/mt7986a-ruijie-rg-x60-pro-107m.dts

      - name: Apply filogic.mk patch
        run: |
          cd immortalwrt
          python3 -c "
          with open('target/linux/mediatek/image/filogic.mk', 'r') as f:
              content = f.read()
          insert_after = 'TARGET_DEVICES += ruijie_rg-x60-pro\n'
          new_def = '''
define Device/ruijie_rg-x60-pro-107m
  DEVICE_VENDOR := Ruijie
  DEVICE_MODEL := RG-X60 Pro
  DEVICE_VARIANT := 107M (Yuzhii U-Boot Layout)
  DEVICE_DTS := mt7986a-ruijie-rg-x60-pro-107m
  DEVICE_DTS_DIR := ../dts
  DEVICE_PACKAGES := kmod-mt7986-firmware mt7986-wo-firmware
  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
endef
TARGET_DEVICES += ruijie_rg-x60-pro-107m
'''
          if insert_after in content:
              content = content.replace(insert_after, insert_after + new_def)
              with open('target/linux/mediatek/image/filogic.mk', 'w') as f:
                  f.write(content)
              print('107m device definition added')
          else:
              print('ERROR: ruijie_rg-x60-pro definition not found')
              exit(1)
          "

      - name: Update feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cd immortalwrt
          cp ../config.107m-clean.seed .config.seed
          make defconfig
          grep "CONFIG_TARGET_mediatek_filogic_DEVICE_ruijie_rg-x60-pro-107m=y" .config

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd immortalwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Prepare artifacts
        if: success()
        run: |
          cd immortalwrt/bin/targets/mediatek/filogic
          mkdir -p ../../../../output
          cp immortalwrt-*ruijie_rg-x60-pro-107m* ../../../../output/ 2>/dev/null || true
          cp *.buildinfo ../../../../output/ 2>/dev/null || true
          cp sha256sums ../../../../output/ 2>/dev/null || true
          cd ../../../../output
          ls -lh

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.10-ruijie-x60-pro-107m
          path: output/
          retention-days: 30

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v25.10-x60pro-107m-${{ github.run_number }}
          name: ImmortalWrt 25.10 - Ruijie X60 PRO 107M (${{ github.run_number }})
          files: output/*
          body: |
            ## ImmortalWrt 25.10 - 锐捷 X60 PRO (107M Yuzhii U-Boot 布局)

            ### 设备信息
            - 设备: Ruijie RG-X60 Pro
            - SoC: MediaTek MT7986A (Filogic 830)
            - 布局: Yuzhii U-Boot 107M
            - 版本: ImmortalWrt 25.10
            - 类型: 纯净版 (Clean)

            ### 分区布局 (107M)
            | 分区 | 偏移 | 大小 |
            |------|------|------|
            | BL2 | 0x000000 | 1MB |
            | u-boot-env | 0x100000 | 512KB |
            | Factory | 0x180000 | 2MB |
            | FIP | 0x380000 | 2MB |
            | ubi | 0x580000 | 107MB |

            ### 刷机说明
            1. 确保已刷入 Yuzhii U-Boot (107M布局)
            2. 进入 U-Boot failsafe WebUI (长按reset键)
            3. 上传 *-squashfs-sysupgrade.bin 固件
            4. 等待刷机完成并自动重启

            ### 注意
            - 此固件仅适用于已刷入 Yuzhii U-Boot 107M 布局的设备
            - 刷机前请备份原厂分区
            - 刷机有风险，请谨慎操作
