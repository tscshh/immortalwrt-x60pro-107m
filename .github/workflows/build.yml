name: Build ImmortalWrt 25.10 for Ruijie X60 PRO (107M)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ImmortalWrt version'
        required: true
        default: 'openwrt-25.12'

env:
  DEVICE_NAME: ruijie_rg-x60-pro-107m
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget python3-pyelftools libelf-dev ecj fastjar java-propose-classpath python3 time xsltproc docbook-utils fop dblatex xmlto genisoimage grub-common p7zip-full

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b ${{ github.event.inputs.version }} https://github.com/immortalwrt/immortalwrt.git

      - name: Apply 107M layout DTS
        run: |
          cp mt7986a-ruijie-rg-x60-pro-107m.dts immortalwrt/target/linux/mediatek/dts/mt7986a-ruijie-rg-x60-pro-107m.dts

      - name: Apply filogic.mk patch
        run: |
          cd immortalwrt
          python3 << 'PYEOF'
          with open('target/linux/mediatek/image/filogic.mk', 'r') as f:
              content = f.read()
          marker = 'TARGET_DEVICES += ruijie_rg-x60-pro\n'
          addition = '\ndefine Device/ruijie_rg-x60-pro-107m\n  DEVICE_VENDOR := Ruijie\n  DEVICE_MODEL := RG-X60 Pro\n  DEVICE_VARIANT := 107M (Yuzhii U-Boot Layout)\n  DEVICE_DTS := mt7986a-ruijie-rg-x60-pro-107m\n  DEVICE_DTS_DIR := ../dts\n  DEVICE_PACKAGES := kmod-mt7986-firmware mt7986-wo-firmware\n  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata\nendef\nTARGET_DEVICES += ruijie_rg-x60-pro-107m\n'
          if marker in content:
              content = content.replace(marker, marker + addition)
              with open('target/linux/mediatek/image/filogic.mk', 'w') as f:
                  f.write(content)
              print('107m device definition added')
          else:
              print('ERROR: ruijie_rg-x60-pro definition not found')
              raise SystemExit(1)
          PYEOF

      - name: Update feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fix recursive dependency
        run: |
          cd immortalwrt
          rm -rf feeds/luci/applications/luci-app-weechat
          rm -rf package/feeds/luci/luci-app-weechat
          ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cd immortalwrt
          cp ../config.107m-clean.seed .config.seed
          make defconfig
          grep "CONFIG_TARGET_mediatek_filogic_DEVICE_ruijie_rg-x60-pro-107m=y" .config

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd immortalwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Prepare artifacts
        if: success()
        run: |
          mkdir -p output
          cp immortalwrt/bin/targets/mediatek/filogic/immortalwrt-*ruijie_rg-x60-pro-107m* output/ 2>/dev/null || true
          cp immortalwrt/bin/targets/mediatek/filogic/*.buildinfo output/ 2>/dev/null || true
          cp immortalwrt/bin/targets/mediatek/filogic/sha256sums output/ 2>/dev/null || true
          ls -lh output/

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.10-ruijie-x60-pro-107m
          path: output/
          retention-days: 30

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v25.10-x60pro-107m-${{ github.run_number }}
          name: ImmortalWrt 25.10 - Ruijie X60 PRO 107M
          files: output/*
          body: |
            ## ImmortalWrt 25.10 - 锐捷 X60 PRO (107M Yuzhii U-Boot 布局)

            - 设备: Ruijie RG-X60 Pro
            - SoC: MediaTek MT7986A (Filogic 830)
            - 布局: Yuzhii U-Boot 107M
            - 类型: 纯净版 (Clean)

            ### 分区布局 (107M)
            | 分区 | 偏移 | 大小 |
            |------|------|------|
            | BL2 | 0x000000 | 1MB |
            | u-boot-env | 0x100000 | 512KB |
            | Factory | 0x180000 | 2MB |
            | FIP | 0x380000 | 2MB |
            | ubi | 0x580000 | 107MB |

            ### 刷机说明
            1. 确保已刷入 Yuzhii U-Boot (107M布局)
            2. 进入 U-Boot failsafe WebUI (长按reset键)
            3. 上传 *-squashfs-sysupgrade.bin 固件
            4. 等待刷机完成并自动重启
