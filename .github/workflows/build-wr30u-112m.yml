name: Build ImmortalWrt 25.10 for Xiaomi WR30U (112M)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ImmortalWrt version'
        required: true
        default: 'openwrt-25.12'

env:
  DEVICE_NAME: xiaomi_mi-router-wr30u-112m
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget python3-pyelftools libelf-dev ecj fastjar java-propose-classpath python3 time xsltproc docbook-utils fop dblatex xmlto genisoimage grub-common p7zip-full

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b ${{ github.event.inputs.version }} https://github.com/immortalwrt/immortalwrt.git

      - name: Apply 112M layout DTS
        run: |
          cp mt7981b-xiaomi-mi-router-wr30u-112m.dts immortalwrt/target/linux/mediatek/dts/mt7981b-xiaomi-mi-router-wr30u-112m.dts

      - name: Apply filogic.mk patch
        run: |
          python3 wr30u-patch.py immortalwrt/target/linux/mediatek/image/filogic.mk

      - name: Update feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fix recursive dependency
        run: |
          cd immortalwrt
          ./scripts/feeds uninstall luci-app-weechat
          rm -rf package/feeds/luci/luci-app-weechat

      - name: Apply default files (LAN 192.168.6.1 + UPnP)
        run: |
          mkdir -p immortalwrt/files
          cp -r files/* immortalwrt/files/
          find immortalwrt/files -type f -exec chmod +x {} \;
          find immortalwrt/files -type f

      - name: Load configuration
        run: |
          cd immortalwrt
          printf 'CONFIG_TARGET_mediatek=y\nCONFIG_TARGET_mediatek_filogic=y\nCONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-wr30u-112m=y\nCONFIG_PACKAGE_kmod-cfg80211=y\nCONFIG_PACKAGE_kmod-mac80211=y\nCONFIG_PACKAGE_kmod-mt76-core=y\nCONFIG_PACKAGE_kmod-mt76-connac=y\nCONFIG_PACKAGE_kmod-mt7915e=y\nCONFIG_PACKAGE_kmod-mt7981-firmware=y\nCONFIG_PACKAGE_mt7981-wo-firmware=y\nCONFIG_PACKAGE_luci-app-upnp=y\nCONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y\n' > .config
          make defconfig
          for s in CONFIG_PACKAGE_kmod-cfg80211 CONFIG_PACKAGE_kmod-mac80211 CONFIG_PACKAGE_kmod-mt7915e CONFIG_PACKAGE_luci-app-upnp; do
            grep -q "^$s=y" .config || { echo "::error::missing $s=y"; exit 1; }
            echo "OK $s=y"
          done
          grep "CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-wr30u-112m=y" .config

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd immortalwrt
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log || {
            echo "::warning::First build pass failed, attempting autoconf.h staging fix"
            STG="staging_dir/target-aarch64_cortex-a53_musl/usr/include/mac80211-backport/backport"
            if [ ! -f "$STG/autoconf.h" ]; then
              AH=$(find build_dir -name autoconf.h -path '*backports*' 2>/dev/null | head -n1)
              echo "Found autoconf.h candidate: $AH"
              if [ -n "$AH" ]; then
                mkdir -p "$STG"
                cp "$AH" "$STG/autoconf.h"
                echo "Installed $AH -> $STG/autoconf.h"
              fi
            fi
            (make -j$(nproc) V=s 2>&1 || make -j1 V=s 2>&1) | tee -a build.log
          }

      - name: Prepare artifacts
        if: success()
        run: |
          mkdir -p output
          cp immortalwrt/bin/targets/mediatek/filogic/immortalwrt-*xiaomi_mi-router-wr30u-112m* output/
          cp immortalwrt/bin/targets/mediatek/filogic/*.buildinfo output/ || true
          cp immortalwrt/bin/targets/mediatek/filogic/sha256sums output/ || true
          ls -lh output/
          ls output/*sysupgrade.bin || { echo "::error::Firmware image missing!"; exit 1; }

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.10-xiaomi-wr30u-112m
          path: output/
          retention-days: 30

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v25.10-wr30u-112m-${{ github.run_number }}
          name: ImmortalWrt 25.10 - Xiaomi WR30U 112M
          files: output/*
          body: |
            ## ImmortalWrt 25.10 - 小米 WR30U (112M Yuzhii U-Boot 布局)

            - 设备: Xiaomi Mi Router WR30U (MT7981B)
            - 布局: Yuzhii U-Boot immortalwrt-112m (NMBM)
            - 类型: 纯净版 + UPnP
            - 默认后台: http://192.168.6.1

            ### 分区布局 (112M)
            | 分区 | 偏移 | 大小 |
            |------|------|------|
            | BL2 | 0x000000 | 1MB |
            | Nvram | 0x100000 | 256KB |
            | Bdata | 0x140000 | 256KB |
            | Factory | 0x180000 | 2MB |
            | FIP | 0x380000 | 2MB |
            | crash | 0x580000 | 256KB |
            | crash_log | 0x5c0000 | 256KB |
            | ubi | 0x600000 | 112MB |
            | KF | 0x7600000 | 256KB |

            ### 刷机说明
            1. 确保已刷入 Yuzhii U-Boot，并在 WebUI 中选择 `immortalwrt-112m` 布局
            2. 进入 U-Boot failsafe WebUI (长按 reset 键上电)
            3. 上传 `*-squashfs-sysupgrade.bin`（或 `*-squashfs-factory.bin`）
            4. 等待刷机完成并自动重启
            5. 首次启动后访问 http://192.168.6.1
